services:
  db:
    image: postgres:15
    container_name: manhole-db
    environment:
      POSTGRES_DB: manhole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - manhole-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manhole"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: manhole-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/manhole
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - manhole-uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: manhole-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  manhole-pgdata:
  manhole-uploads:
